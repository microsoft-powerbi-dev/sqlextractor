[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-sql-exporter"
version = "1.3.0"
description = "Validated Excel mappings, streaming SQL Server exports, and safe window resume"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1.5,<4", "xlrd>=2.0.1,<3", "olefile>=0.47,<1", "filelock>=3.16,<4"]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.2,<6"]
test = ["pytest>=8,<10", "xlwt==1.3.0"]

[project.scripts]
sql-exporter = "sql_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
